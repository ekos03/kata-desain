<title>Kantor NOEKANG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<style>
/* Layout: kabin roket 3D penuh layar; atas: nama kantor + jam kerja; bawah: tombol sudut pandang, daftar kru, panel detail */
:root{--bg:#0B0518;--line:#EEE9FF;--mute:#A79CCB;--card:rgba(32,18,66,.84);--edge:rgba(168,152,255,.28);--accent:#A898FF;--pink:#FF8FD8;
--ok:#4FE0C8;--work:#F4A259;--err:#FF6B5B;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--line);font-family:var(--sans);overflow:hidden}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%;outline:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:14px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
background:linear-gradient(var(--bg) 40%,transparent);pointer-events:none}
h1{font-size:18px;font-weight:800;margin:0;letter-spacing:.14em}
h1 small{display:block;font-weight:500;font-size:11.5px;color:var(--mute);letter-spacing:.02em;margin-top:2px}
.meta{display:grid;gap:5px;justify-items:end}
.live,.clock{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.06em;
background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:5px 10px;white-space:nowrap}
.live{text-transform:uppercase}
.clock b{color:var(--line);font-variant-numeric:tabular-nums}
.clock.on{border-color:var(--work)}.clock.on span{color:var(--work)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.live.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live.on{color:var(--ok)}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:8px;
padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:8px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--card);color:var(--line);
border-radius:999px;padding:7px 12px 7px 9px;font:500 12px var(--sans);cursor:pointer;backdrop-filter:blur(8px)}
.view{padding:6px 12px;font-weight:600;color:var(--mute)}
.view[aria-pressed="true"]{color:var(--line);border-color:var(--accent);background:rgba(120,80,220,.45)}
.chip:focus-visible,.close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.chip[data-s="bekerja"]{border-color:var(--work)}
.chip[data-s="macet"]{border-color:var(--err)}
.chip[aria-pressed="true"]{background:rgba(120,80,220,.45)}
.chip b{font-weight:600}
.chip span{color:var(--mute)}
#panel{pointer-events:auto;background:var(--card);border:1px solid var(--edge);border-radius:22px;padding:14px 18px;
max-width:420px;backdrop-filter:blur(10px);display:grid;gap:6px;box-shadow:0 10px 40px rgba(60,20,140,.35)}
#panel h2{margin:0;font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
#panel .role{font-size:12px;color:var(--mute);margin-top:-4px}
#panel dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
#panel dt{color:var(--mute)}#panel dd{margin:0;min-width:0;overflow-wrap:anywhere}
.close{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:999px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;background:rgba(238,233,255,.1);color:var(--mute)}
.pill.bekerja{background:rgba(244,162,89,.18);color:var(--work)}
.pill.selesai{background:rgba(79,224,200,.15);color:var(--ok)}
.pill.macet{background:rgba(255,107,91,.18);color:var(--err)}
#hint{font-size:11.5px;color:var(--mute)}
@media (min-width:760px){#bottom{display:grid;grid-template-columns:1fr 420px;align-items:end}#views,#chips{grid-column:1;flex-wrap:wrap}#panel{grid-column:2;grid-row:1/span 2}}
</style>

<div id="scene" aria-label="Kantor NOEKANG dalam kabin roket 3D: seret untuk memutar, cubit atau gulir untuk memperbesar"></div>
<header>
  <h1>NOEKANG<small>Divisi bangunan dan divisi KATA DESAIN</small></h1>
  <div class="meta">
    <div class="live" id="live"><span class="dot"></span><span id="liveTxt">Menghubungkan…</span></div>
    <div class="clock" id="clock"><b id="clockTime">--.--</b><span id="clockTxt">WIB</span></div>
    <div class="clock" id="clock2"><span id="clockTxt2">KATA DESAIN</span></div>
  </div>
</header>
<div id="bottom">
  <div class="row" id="views" role="group" aria-label="Sudut pandang"></div>
  <div class="row" id="chips" role="list"></div>
  <section id="panel" aria-live="polite"></section>
</div>

let selected=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function fmtTime(t){if(!t)return"–";const d=new Date(t);if(isNaN(d))return esc(t);
 return d.toLocaleString("id-ID",{timeZone:"Asia/Jakarta",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" WIB";}
const st=id=>state.pegawai[id]||{};
const status=id=>(st(id).status&&LABEL[st(id).status])?st(id).status:"idle";
function wibMinutes(){const d=new Date(Date.now()+7*3600e3);return d.getUTCHours()*60+d.getUTCMinutes();}
const jamKerja=()=>{const m=wibMinutes(),d=new Date(Date.now()+7*3600e3).getUTCDay();return d>=1&&d<=5&&m>=JAM_KERJA.mulai&&m<JAM_KERJA.selesai;};
// Jam kerja divisi KATA DESAIN: produksi Selasa, Kamis, Sabtu 10.43–13.00; riset Arya Senin 13.17–14.30 WIB.
const JAM_DESAIN={hari:[2,4,6],mulai:10*60+43,selesai:13*60,teks:"Sel, Kam, Sab 10.43–13.00",riset:{hari:1,mulai:13*60+17,selesai:14*60+30}};
function wibDay(){return new Date(Date.now()+7*3600e3).getUTCDay();}
const jamDesain=()=>{const m=wibMinutes();return JAM_DESAIN.hari.includes(wibDay())&&m>=JAM_DESAIN.mulai&&m<JAM_DESAIN.selesai;};
const jamRisetDesain=()=>{const m=wibMinutes(),r=JAM_DESAIN.riset;return wibDay()===r.hari&&m>=r.mulai&&m<r.selesai;};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Dasar 3D ---------- */
const host=document.getElementById("scene");

R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;
host.appendChild(R.domElement);

Object.assign(sun.shadow.camera,{left:-30,right:20,top:9,bottom:-9,far:40});S.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o));
const sh=m=>{m.castShadow=m.receiveShadow=true;return m;};
function mesh(geo,mat,x,y,z,p){const m=sh(new THREE.Mesh(geo,mat));m.position.set(x||0,y||0,z||0);(p||S).add(m);return m;}
// kotak bersudut membulat
function rbox(w,h,d,r,mat,x,y,z,p){r=Math.min(r,w/2-.01,d/2-.01);const s=new THREE.Shape(),a=w/2,b=d/2;
 s.moveTo(-a+r,-b);s.lineTo(a-r,-b);s.quadraticCurveTo(a,-b,a,-b+r);s.lineTo(a,b-r);s.quadraticCurveTo(a,b,a-r,b);
 s.lineTo(-a+r,b);s.quadraticCurveTo(-a,b,-a,b-r);s.lineTo(-a,-b+r);s.quadraticCurveTo(-a,-b,-a+r,-b);
 const bv=Math.min(.04,h/3);const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(.001,h-bv*2),bevelEnabled:true,bevelThickness:bv,bevelSize:bv,bevelSegments:3,curveSegments:8});
 g.translate(0,0,-(h-bv*2)/2);g.rotateX(-Math.PI/2);return mesh(g,mat,x,y,z,p);}
function canvasTex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");if(draw)draw(g,w,h);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return{c,g,t};}

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function plane(w,h,tex,x,y,z,p){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true}));m.position.set(x,y,z);(p||S).add(m);return m;}

// Papan jadwal
const board=canvasTex(1600,760);
plane(7.6,3.61,board.t,-8.9,4.3,-7.4);

function drawBoard(){drawBoardOn(board,"JADWAL VIDEO NOEKANG","Senin–Jumat",v=>v.divisi!=="desain");drawBoardOn(board2,"JADWAL KATA DESAIN","Sel, Kam, Sab",v=>v.divisi==="desain");}
function drawBoardOn(bd,title,sub,flt){const g=bd.g,W=1600,H=760;g.clearRect(0,0,W,H);rr(g,6,6,W-12,H-12,56);g.fillStyle="#1a0c38";g.fill();g.strokeStyle="#8c6cf0";g.lineWidth=6;g.stroke();
 const vids=[...state.video].filter(flt).sort((a,b)=>(a.hari||99)-(b.hari||99));
 txt(g,title,50,72,38,"#EEE9FF","800");txt(g,sub+" · "+vids.length+" video",W-50,72,26,"#A79CCB","600","right");
 if(!vids.length)txt(g,"Menunggu data jadwal…",50,140,28,"#A79CCB","500");

const SEATED=["type","sitIdle","stuck","sofa","relax","meet"];
function pose(P,name,t,ph){const L=P.legs,A=P.arms;
 L.forEach(l=>{l.hip.rotation.set(0,0,0);l.knee.rotation.set(0,0,0);});
 A.forEach((a,i)=>{a.sh.rotation.set(0,0,(i?1:-1)*.07);a.el.rotation.set(-.12,0,0);});
 P.torso.rotation.set(0,0,0);P.head.rotation.set(0,0,0);P.cup.visible=false;P.cue.visible=false;
 const seated=SEATED.includes(name);
 if(P.skirt){P.skirt.scale.y=seated?.4:1;P.skirt.position.set(0,seated?.72:.6,seated?.1:0);}
 if(seated)L.forEach(l=>{l.hip.rotation.x=-1.57;l.knee.rotation.x=1.57;});
 const b=Math.sin(t*1.6+ph)*.02;
 switch(name){
  case"walk":{const w=Math.sin(t*7+ph);L[0].hip.rotation.x=w*.5;L[1].hip.rotation.x=-w*.5;L[0].knee.rotation.x=Math.max(0,w)*.7;L[1].knee.rotation.x=Math.max(0,-w)*.7;
   A[0].sh.rotation.x=-w*.45;A[1].sh.rotation.x=w*.45;A.forEach(a=>a.el.rotation.x=-.3);break;}
  case"meet":A.forEach((a,i)=>{a.sh.rotation.x=-.7;a.el.rotation.x=-.5;});P.head.rotation.y=Math.sin(t*.5+ph)*.4;P.head.rotation.x=Math.max(0,Math.sin(t*.9+ph))*.12;break;
  case"sleep":A.forEach((a,i)=>{a.sh.rotation.z=(i?1:-1)*.12;a.el.rotation.x=0;});P.head.rotation.y=.25;break;
  case"type":A.forEach((a,i)=>{a.sh.rotation.x=-.55;a.el.rotation.x=-.9+Math.sin(t*14+i*2+ph)*.1;});P.head.rotation.x=.15+b;break;
  case"sitIdle":A.forEach(a=>{a.sh.rotation.x=-.25;a.el.rotation.x=-.85;});P.head.rotation.y=Math.sin(t*.4+ph)*.35;break;
  case"stuck":A.forEach(a=>{a.sh.rotation.x=-.9;a.el.rotation.x=-2.0;});P.head.rotation.x=.35;break;
  case"sofa":P.torso.rotation.x=-.14;A.forEach(a=>{a.sh.rotation.x=-.15;a.el.rotation.x=-.7;});P.head.rotation.x=.08+b;P.head.rotation.z=Math.sin(t*.5+ph)*.06;break;
  case"relax":P.torso.rotation.x=-.25;A[0].sh.rotation.x=-.3;A[0].el.rotation.x=-2.2;A[1].sh.rotation.x=-.15;A[1].el.rotation.x=-.6;P.head.rotation.x=-.1;break;
  case"shoot":{L[0].hip.rotation.x=-.3;L[1].hip.rotation.x=.25;P.torso.rotation.x=.95;P.head.rotation.x=-.75;
   const k=Math.sin(t*2.4+ph);A.forEach(a=>{a.sh.rotation.x=-.75;a.el.rotation.x=-.3;});A[0].sh.rotation.x=-.55+k*.25;A[0].el.rotation.x=-.7-k*.35;
   P.cue.visible=true;P.cue.position.set(-.08,.3+k*.06,.4+k*.06);break;}
  case"watch":A.forEach((a,i)=>{a.sh.rotation.x=-.4;a.sh.rotation.z=i?-.45:.45;a.el.rotation.x=-1.75;});P.head.rotation.y=Math.sin(t*.7+ph)*.3;break;
  case"sip":{const k=(Math.sin(t*1.1+ph)+1)/2;A[0].sh.rotation.x=-.35-k*.25;A[0].el.rotation.x=-1.4-k*.8;P.cup.visible=true;P.head.rotation.x=-k*.15;break;}
  case"gaze":A.forEach(a=>{a.sh.rotation.x=.4;a.el.rotation.x=-.45;});P.head.rotation.x=-.3;P.head.rotation.y=Math.sin(t*.3+ph)*.4;break;
  case"think":A[0].sh.rotation.x=-.45;A[0].el.rotation.x=-2.3;A[1].sh.rotation.x=-.3;A[1].sh.rotation.z=-.4;A[1].el.rotation.x=-1.6;P.head.rotation.x=.08+b;break;
  default:P.head.rotation.y=Math.sin(t*.6+ph)*.3;}
 return seated;}

function desiredSlot(p,period){const s=status(p.s.id);

 if(s==="idle"&&p.s.div&&(p.s.id==="riset-desain"?jamRisetDesain():jamDesain()))return SLOTS["meja-"+p.s.id];

function assign(){const period=Math.floor(Date.now()/45000),taken=new Set(),n=LEISURE.length+2;let mi=0,bi=0;
 people.forEach(p=>{if(status(p.s.id)==="rapat"&&!p.eko&&mi<MEET_SLOTS.length){p.want=MEET_SLOTS[mi++];return;}
  const d=desiredSlot(p,period);if(d){p.want=d;return;}
  if(malam()&&!p.eko&&bi<BEDS.length){const b=BEDS[bi++];taken.add(b.id);p.want=b;return;}
  let i=(STAFF.indexOf(p.s)*3+period)%n,tries=0;
  while(i<LEISURE.length&&taken.has(LEISURE[i].id)&&tries<n){i=(i+1)%n;tries++;}
  if(i<LEISURE.length){taken.add(LEISURE[i].id);p.want=LEISURE[i];}else p.want=WANDER;});
 people.forEach(p=>{if(p.want!==p.slot){p.path=route(p,p.want);p.slot=p.want;p.arrived=false;p.pause=0;}});}

 if(ptrs.size===1){orb.th-=(e.clientX-p.x)*.006;orb.ph-=(e.clientY-p.y)*.006;moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);}
 p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)goal.r=Math.max(4,Math.min(48,goal.r*pinch0/d));pinch0=d;moved+=99;}});
const up=e=>{const was=ptrs.size;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(was===1&&moved<8&&e.type==="pointerup")pick(e);};
R.domElement.addEventListener("pointerup",up);R.domElement.addEventListener("pointercancel",up);
R.domElement.addEventListener("wheel",e=>{e.preventDefault();goal.r=Math.max(4,Math.min(48,goal.r*(1+Math.sign(e.deltaY)*.1)));},{passive:false});
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
function pick(e){const r=R.domElement.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(v2,cam);
 const hit=ray.intersectObjects(S.children,true).find(h=>h.object.userData&&(h.object.userData.staff||h.object.userData.video||h.object.userData.moto));
 if(!hit)return;const u=hit.object.userData;if(u.staff)selectStaff(u.staff);else select(u.video?{video:u.video.id}:{moto:true});}
function resize(){const w=host.clientWidth,h=host.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<600?58:45;cam.updateProjectionMatrix();
 if(!follow){const v=VIEWS.find(q=>q.id===view);goal.r=v.r[narrow()?0:1];}}
addEventListener("resize",resize);resize();orb.r=goal.r;

/* ---------- UI ---------- */
const viewsEl=document.getElementById("views"),chips=document.getElementById("chips"),panel=document.getElementById("panel");
function renderViews(){viewsEl.innerHTML=VIEWS.map(v=>`<button class="chip view" data-v="${v.id}" aria-pressed="${!follow&&view===v.id}">${v.label}</button>`).join("");}
viewsEl.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setView(b.dataset.v);});
function renderChips(){chips.innerHTML=STAFF.map(p=>{const s=status(p.id);return`<button class="chip" role="listitem" data-id="${p.id}" data-s="${s}" aria-pressed="${follow===p.id}"><i style="background:${s==="idle"?"#4a3d70":s==="macet"?"#FF6B5B":p.c}"></i><b>${esc(p.nama)}</b><span>${LABEL[s]}</span></button>`;}).join("");}
chips.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)selectStaff(b.dataset.id);});
function selectStaff(id){follow=id;goal.r=narrow()?9:7.5;select({staff:id});renderViews();renderChips();}
function select(sel){selected=sel;renderPanel();}
function renderPanel(){
 if(!selected){panel.innerHTML=`<div id="hint">Ketuk nama kru untuk mengikutinya, atau ketuk meja, video di rak, dan motor untuk detail. Jam kerja NOEKANG ${JAM_KERJA.teks} WIB (Senin–Jumat); KATA DESAIN ${JAM_DESAIN.teks} WIB, riset Arya Senin siang. Kru yang tugasnya selesai bebas nonton TV, main biliar, ngopi, jalan-jalan, atau tidur di kabin tidur. Lampu utama redup di luar jam kerja dan menyala saat ada yang bekerja atau rapat.</div>`;return;}
 const x=`<button class="close" aria-label="Tutup detail" data-close>×</button>`;
 if(selected.moto){panel.innerHTML=`<h2><span>Garasi Touring</span>${x}</h2><div class="role">Motor touring kesayangan Eko, dipajang di Ruang Eko.</div>`;}
 else if(selected.staff){const p=STAFF.find(q=>q.id===selected.staff),d=st(p.id),s=status(p.id),pp=people.find(q=>q.s===p);
  panel.innerHTML=`<h2><span>${esc(p.nama)} <span class="pill ${s}">${LABEL[s]}</span></span>${x}</h2><div class="role">${esc(p.peran)} · ${esc(p.langkah)}</div>
  <dl><dt>Sedang</dt><dd id="act">${esc(activity(pp))}</dd><dt>Tugas terakhir</dt><dd>${esc(d.tugas||"Belum ada tugas tercatat")}</dd><dt>Video</dt><dd>${esc(d.video||"–")}</dd>
  <dt>Waktu</dt><dd>${fmtTime(d.waktu)}</dd>${s==="macet"?`<dt>Kendala</dt><dd>${esc(d.pesan||"–")}</dd>`:""}</dl>`;}
 else{const v=state.video.find(q=>q.id===selected.video)||{};
  panel.innerHTML=`<h2><span>${esc(v.judul||v.id)}</span>${x}</h2><div class="role">Hari ${esc(v.hari||"–")} · ${esc(v.tanggal||"")}</div>
  <dl><dt>Status</dt><dd>${esc(v.status||"–")}</dd><dt>Catatan</dt><dd>${esc(v.catatan||"–")}</dd><dt>Berkas</dt><dd>${esc(v.berkas||"–")}</dd><dt>Diperbarui</dt><dd>${fmtTime(v.waktu)}</dd></dl>`;}}
panel.addEventListener("click",e=>{if(e.target.closest("[data-close]")){selected=null;if(follow)setView(view);renderPanel();}});
const clockT=document.getElementById("clockTime"),clockTxt=document.getElementById("clockTxt"),clockEl=document.getElementById("clock");
function tickClock(){const m=wibMinutes();clockT.textContent=String(Math.floor(m/60)).padStart(2,"0")+"."+String(m%60).padStart(2,"0");
 const on=jamKerja();clockEl.classList.toggle("on",on);clockTxt.textContent=on?"NOEKANG · jam kerja":`NOEKANG · ${JAM_KERJA.teks}`;
 const on2=jamDesain()||jamRisetDesain(),c2=document.getElementById("clock2");c2.classList.toggle("on",on2);
 document.getElementById("clockTxt2").textContent=on2?"KATA DESAIN · jam kerja":`KATA DESAIN · ${JAM_DESAIN.teks}`;}
function refresh(){applyDesks();renderChips();drawBoard();drawShelf();assign();renderPanel();}
tickClock();renderViews();refresh();
let lampGoal=1,lamp=1;
const updLamp=()=>{const kerja=jamKerja()||jamDesain()||jamRisetDesain()||STAFF.some(q=>["bekerja","macet","rapat"].includes(status(q.id)));lampGoal=kerja?1:.3;};updLamp();
setInterval(()=>{tickClock();assign();updLamp();const a=document.getElementById("act");if(a&&selected&&selected.staff)a.textContent=activity(people.find(q=>q.s.id===selected.staff));},1000);

/* ---------- Putaran animasi ---------- */
let last=performance.now(),lastSlow=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 if(t-lastSlow>.12){lastSlow=t;drawTV(t);STAFF.forEach(p=>{if(status(p.id)==="bekerja")drawHolo(p.id,"bekerja",t);});cueBall.position.x=-.8+((t*.5)%1)*.9;}
 people.forEach(p=>stepPerson(p,dt,t));
 if(follow){const pp=people.find(q=>q.s.id===follow);goal.tgt.set(pp.pos.x,1.2,pp.pos.z);}
 lamp+=(lampGoal-lamp)*Math.min(1,dt*1.5);hemi.intensity=.5*lamp;sun.intensity=.5*lamp;
 orb.tgt.lerp(goal.tgt,Math.min(1,dt*3));orb.r+=(goal.r-orb.r)*Math.min(1,dt*3);placeCam();
 if(!reduce&&bike)bike.rotation.y=t*.35;
 if(!reduce){knot.rotation.y=t*.6;knot.rotation.x=t*.3;}
 R.render(S,cam);}
requestAnimationFrame(loop);

/* ---------- Live dari database ---------- */
const live=document.getElementById("live"),liveTxt=document.getElementById("liveTxt");
const timer=setTimeout(()=>{if(!live.classList.contains("on"))liveTxt.textContent="Data belum tersambung";},10000);
(async()=>{const db=window.claude&&await window.claude.use("db");
 if(!db){clearTimeout(timer);liveTxt.textContent="Mode pajangan";return;}
 const ok=()=>{clearTimeout(timer);live.classList.add("on");liveTxt.textContent="Live";};
 const fail=()=>{clearTimeout(timer);live.classList.remove("on");liveTxt.textContent="Koneksi terputus";};
 db.collection("pegawai").onSnapshot(snap=>{ok();state.pegawai={};snap.docs.forEach(d=>state.pegawai[d.id]=d.data()||{});refresh();},fail);
 db.collection("video").onSnapshot(snap=>{ok();state.video=snap.docs.map(d=>Object.assign({id:d.id},d.data()));refresh();},fail);
})();
})();
</script>
